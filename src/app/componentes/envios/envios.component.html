     ENTREGAS Y ENVÍOS
===================================================== -->

<section id="envios" class="delivery-section">

  <div class="delivery-container">

    <!-- =================================================
         IZQUIERDA - BARILOCHE
    ================================================== -->

    <div class="delivery-bariloche">

      <!-- Imagen -->

      <img
        src="/assets/img/envios.jpg"
        alt="Bariloche - Lago Nahuel Huapi"
        class="delivery-image"
      >


      <!-- Capa suave sobre la imagen -->

      <div class="delivery-image-overlay"></div>


      <!-- Contenido sobre la imagen -->

      <div class="bariloche-content">

        <!-- Marcador -->

        <div class="bariloche-location">

          <i class="fa-solid fa-location-dot"></i>

        </div>


        <!-- Texto -->

        <div class="bariloche-text">

          <p class="bariloche-small">
            Entregas en
          </p>

          <h2>
            Bariloche
          </h2>

          <p class="bariloche-frequency">
            Una vez por semana
          </p>

        </div>


        <!-- Decoración montaña -->

        <div class="bariloche-mountain">

          <i class="fa-solid fa-mountain"></i>

        </div>


        <!-- Camión -->

        <div class="bariloche-truck">

          <i class="fa-solid fa-truck"></i>

        </div>

      </div>

    </div>


    <!-- =================================================
         DERECHA - OTRAS LOCALIDADES
    ================================================== -->

    <div class="delivery-info">

      <div class="delivery-info-content">


        <!-- TÍTULO -->

        <div class="delivery-heading">

          <div class="delivery-pin">

            <i class="fa-solid fa-location-dot"></i>

          </div>

          <div>

            <h2>
              También enviamos a:
            </h2>

            <p class="delivery-cities">

              <span>El Hoyo</span>

              <b>•</b>

              <span>El Bolsón</span>

              <b>•</b>

              <span>Esquel</span>

              <b>•</b>

              <span>y otras ciudades</span>

            </p>

          </div>

        </div>


        <!-- INFORMACIÓN -->

        <div class="delivery-question">

          <div class="delivery-truck-icon">

            <i class="fa-solid fa-truck"></i>

          </div>

          <p>
            Consultá por tu zona y coordiná tu pedido.
          </p>

        </div>


        <!-- BOTÓN -->

        <a
          href="https://wa.me/549XXXXXXXXXX"
          target="_blank"
          class="delivery-zone-button"
        >

          <i class="fa-brands fa-whatsapp"></i>

          Consultá por tu zona

        </a>

      </div>

    </div>

  </div>

</section>
